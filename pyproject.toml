[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-toolkit"
version = "0.5.0"
description = "Інструменти для навчальної мови SIPL: парсер, інтерпретатор, семантичні терми"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["lark", "coverage"]

[project.scripts]
sipl = "sipl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
